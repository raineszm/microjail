name: spec-test-driven
version: 1
description: Test-driven workflow — vertical slices (RED→GREEN→REFACTOR), specs produce actionable test plans
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.


      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new
      capabilities, modifications, or removals. Mark breaking changes with
      **BREAKING**.

      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.


      IMPORTANT: The Capabilities section is critical. It creates the contract
      between

      proposal and specs phases. Research existing specs before filling this in.

      Each capability listed here will need a corresponding spec file.


      Keep it concise (1-2 pages). Focus on the "why" not the "how" -

      implementation details belong in design.md.


      This is the foundation - specs, design, and tasks all build on this.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from openspec/specs/<capability>/ when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description.
      - Every requirement description MUST follow the **Easy Approach to Requirements Syntax (EARS)** patterns using SHALL/MUST. Avoid vague language, should, or may.
      - Each scenario: `#### Scenario: <name>` with GIVEN/WHEN/THEN format.
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      **EARS Requirements Patterns:**
      1. **Ubiquitous** (always active):
         The [system] SHALL [behavior].
      2. **State-Driven** (active during specific state):
         While [state/pre-condition], the [system] SHALL [behavior].
      3. **Event-Driven** (response to a trigger):
         When [trigger], the [system] SHALL [response].
      4. **Optional Feature** (applies if optional feature is present):
         Where [feature is included], the [system] SHALL [behavior].
      5. **Unwanted Behavior** (handling errors or unwanted events):
         If [trigger], then the [system] SHALL [response].

      MODIFIED requirements workflow:
      1. Locate the existing requirement in openspec/specs/<capability>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example:
      ```markdown
      ## ADDED Requirements

      ### Requirement: Data export
      When the user requests a data export, the system SHALL download a CSV file containing all user data.

      #### Scenario: Successful export
      - **GIVEN** the user has data available to export
      - **WHEN** the user triggers the export action
      - **THEN** the system generates and downloads the CSV file

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
      Scenarios describe business requirements, not implementation details. Keep scenarios at the level of observable behavior: what condition triggers what outcome.
      Scenario names should be descriptive. Each scenario MUST have at least one GIVEN, WHEN, and THEN.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.


      When to include design.md (create only if any apply):

      - Cross-cutting change (multiple services/modules) or new architectural
      pattern

      - New external dependency or significant data model changes

      - Security, performance, or migration complexity

      - Ambiguity that benefits from technical decisions before coding


      Sections:

      - **Context**: Background, current state, constraints, stakeholders

      - **Goals / Non-Goals**: What this design achieves and explicitly excludes

      - **Decisions**: Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
      Format: [Risk] → Mitigation

      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)

      - **Open Questions**: Outstanding decisions or unknowns to resolve


      Focus on architecture and approach, not line-by-line implementation.

      Reference the proposal for motivation and specs for requirements.


      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks and incremental test plan
    template: tasks.md
    instruction: |
      Create the task list organized as vertical slices (TDD Slices).

      **IMPORTANT: Incremental planning is required to avoid outrunning our headlights.**
      We only plan the test details (Arrange/Act/Assert) and tasks for Slice 1 (the Tracer Bullet) initially.
      Later slices are kept as placeholders/pending.

      Step 1: Identify all slices needed for the change, derived from the requirements/scenarios in specs.
      Step 2: Slice 1 is the Tracer Bullet - the simplest end-to-end scenario that proves the path works.
      Step 3: Define the detailed Test Strategy for Slice 1 only (Arrange, Act, Assert).
      Step 4: For Slice 1, generate the three standard TDD tasks: RED, GREEN, REFACTOR.
      Step 5: For all subsequent slices, only generate a header with the suffix `[Pending]`, and a placeholder task list.

      Rules:
      - Each detailed slice MUST contain exactly one RED (test function name), one GREEN, one REFACTOR task, in that order.
      - Order slices by dependency: earlier slices establish capabilities that later slices depend on.
      - Format for detailed slices:
        ## Slice N: Tracer Bullet - <Capability Name>
        - **Test**: <test_function_name in tests/path/to/test_file.py>
        - **Arrange**: <concrete setup: imports, fixtures, objects, values>
        - **Act**: <specific function call with arguments>
        - **Assert**: <specific assertion: return value, state, exception>

        - [ ] N.1 RED: test_function_name
        - [ ] N.2 GREEN: description
        - [ ] N.3 REFACTOR: description or "none"
      - Format for pending slices:
        ## Slice N: [Pending] - <Capability Name>
        <!-- Test details and tasks will be planned after Slice N-1 is complete -->
        - [ ] N.1 RED: pending
        - [ ] N.2 GREEN: pending
        - [ ] N.3 REFACTOR: pending
    requires:
      - specs
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Work through implementation tasks one vertical slice at a time, adhering strictly to TDD (RED -> GREEN -> REFACTOR) and utilizing the project's built-in `tdd` skill.

    **Incremental Planning Loop:**
    1. Start with Slice 1 (Tracer Bullet).
    2. Execute the TDD loop:
       - RED: Write the failing test(s) matching the Arrange/Act/Assert strategy. Verify the test fails.
       - GREEN: Write minimal code to pass the test(s). Verify the test(s) pass.
       - REFACTOR: Clean up implementation and test code while keeping the suite green.
    3. Once Slice N is fully GREEN and REFACTOR is complete, mark the tasks as done.
    4. **PAUSE AND PLAN NEXT SLICE:** Before writing code for Slice N+1:
       - Read the current state of the codebase.
       - Edit `tasks.md` to replace the `[Pending]` section of Slice N+1 with a concrete test strategy (Arrange, Act, Assert) and detailed RED/GREEN/REFACTOR tasks.
       - Only then proceed to execute the TDD loop for Slice N+1.
    5. Repeat until all slices are fully implemented, refactored, and verified.
