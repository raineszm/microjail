name: spec-test-driven
version: 1
description: Test-driven workflow — vertical slices (RED→GREEN→REFACTOR), specs produce actionable test plans
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Create the proposal document that establishes WHY this change is needed.


      Sections:

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new
      capabilities, modifications, or removals. Mark breaking changes with
      **BREAKING**.

      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.


      IMPORTANT: The Capabilities section is critical. It creates the contract
      between

      proposal and specs phases. Research existing specs before filling this in.

      Each capability listed here will need a corresponding spec file.


      Keep it concise (1-2 pages). Focus on the "why" not the "how" -

      implementation details belong in design.md.


      This is the foundation - specs, design, and tasks all build on this.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      Create specification files that define WHAT the system should do.


      Create one spec file per capability listed in the proposal's Capabilities
      section.

      - New capabilities: use the exact kebab-case name from the proposal
      (specs/<capability>/spec.md).

      - Modified capabilities: use the existing spec folder name from
      openspec/specs/<capability>/ when creating the delta spec at
      specs/<capability>/spec.md.


      Delta operations (use ## headers):

      - **ADDED Requirements**: New capabilities

      - **MODIFIED Requirements**: Changed behavior - MUST include full updated
      content

      - **REMOVED Requirements**: Deprecated features - MUST include **Reason**
      and **Migration**

      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format


      Format requirements:

      - Each requirement: `### Requirement: <name>` followed by description

      - Use SHALL/MUST for normative requirements (avoid should/may)

      - Each scenario: `#### Scenario: <name>` with GIVEN/WHEN/THEN format

      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3
      hashtags or bullets will fail silently.

      - Every requirement MUST have at least one scenario.


      MODIFIED requirements workflow:

      1. Locate the existing requirement in openspec/specs/<capability>/spec.md

      2. Copy the ENTIRE requirement block (from `### Requirement:` through all
      scenarios)

      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior

      4. Ensure header text matches exactly (whitespace-insensitive)


      Common pitfall: Using MODIFIED with partial content loses detail at
      archive time.

      If adding new concerns without changing existing behavior, use ADDED
      instead.


      Example:

      ```

      ## ADDED Requirements


      ### Requirement: User can export data

      The system SHALL allow users to export their data in CSV format.


      #### Scenario: Successful export

      - **GIVEN** user has data available to export

      - **WHEN** user clicks "Export" button

      - **THEN** system downloads a CSV file with all user data


      ## REMOVED Requirements


      ### Requirement: Legacy export

      **Reason**: Replaced by new export system

      **Migration**: Use new export endpoint at /api/v2/export

      ```


      Specs should be testable - each scenario is a potential test case.
      Scenarios describe business requirements, not implementation details. Keep
      scenarios at the level of observable behavior: what condition triggers what
      outcome. The test-plan artifact converts these into concrete test code with
      specific function calls, parameter values, and assertions.
      Scenario names should be descriptive (e.g., "check returns False before
      provide" not "test 1"). Each scenario MUST have at least one GIVEN, WHEN, and
      THEN.
    requires:
      - proposal
  - id: test-plan
    generates: test-plan.md
    description: Converts business-level spec scenarios into concrete, actionable test cases
    template: test-plan.md
    instruction: >
      Convert business requirements from spec scenarios into concrete, actionable
      test cases.


      Read all spec files in specs/ — every #### Scenario must have a row in this
      plan.


      Specs describe what should happen at the business level. This plan converts
      those requirements into test code: each scenario becomes a test function with
      specific Arrange/Act/Assert steps.


      For each scenario:
      1. Identify the **test function name** in snake_case, derived from the
      scenario name
      2. **Arrange**: translate GIVEN and WHEN preconditions into concrete test
      setup (module imports, fixture calls, object construction, parameter values)
      3. **Act**: translate the WHEN action into a specific function call or API
      invocation with concrete arguments
      4. **Assert**: translate the THEN expected outcome into test assertions
      (return value checks, state checks, exception checks)


      Identify the **tracer bullet**: the simplest scenario that proves the
      end-to-end path works. This becomes Slice 1.


      Order slices by dependency: the tracer bullet first, then scenarios that
      depend on capabilities proven by earlier slices. Independent scenarios can
      share a slice.


      Each ## heading in the plan is one slice (one vertical RED→GREEN→REFACTOR
      cycle). Multiple related scenarios can share a slice if they test the same
      capability and the implementation for one naturally covers the others.
    requires:
      - specs
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.


      When to include design.md (create only if any apply):

      - Cross-cutting change (multiple services/modules) or new architectural
      pattern

      - New external dependency or significant data model changes

      - Security, performance, or migration complexity

      - Ambiguity that benefits from technical decisions before coding


      Sections:

      - **Context**: Background, current state, constraints, stakeholders

      - **Goals / Non-Goals**: What this design achieves and explicitly excludes

      - **Decisions**: Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
      Format: [Risk] → Mitigation

      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)

      - **Open Questions**: Outstanding decisions or unknowns to resolve


      Focus on architecture and approach, not line-by-line implementation.

      Reference the proposal for motivation and specs for requirements.


      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list organized as vertical slices.


      **IMPORTANT: Each task group is a vertical slice (RED→GREEN→REFACTOR), NOT a
      horizontal layer.**



      Each slice corresponds to one capability from the test-plan and contains
      exactly three tasks:

      1. **RED** — write the failing test (reference the test function name from
      the test-plan)
      2. **GREEN** — write minimal code to make the failing test pass
      3. **REFACTOR** — clean up while keeping all tests green (write "none" if no
      refactoring is needed)



      Rules:
      - **NEVER group all RED tasks together, then all GREEN, then all REFACTOR.**
      This is horizontal slicing — it produces tests that test implementation shape
      instead of behavior.
      - Each slice MUST contain exactly one RED, one GREEN, one REFACTOR task, in
      that order.
      - Slice 1 is the tracer bullet from the test-plan (the simplest end-to-end
      test).
      - Order slices by dependency: earlier slices establish capabilities that later
      slices depend on.
      - Use the format `- [ ] X.Y RED: test_function_name`, `- [ ] X.Y GREEN:
      description`, `- [ ] X.Y REFACTOR: description or "none"`.
      - Reference the test-plan for test function names and slice ordering.



      Example:

      ```
      ## Slice 1: Endpoint reachable after provide
      - [ ] 1.1 RED: test_endpoint_reachable_after_provide
      - [ ] 1.2 GREEN: implement provide() to establish tunnel connection
      - [ ] 1.3 REFACTOR: none

      ```
    requires:
      - specs
      - test-plan
      - design
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Work through tasks one vertical slice at a time, following strict TDD discipline:

    1. Complete all tasks in Slice N before starting Slice N+1.
    2. For each slice, complete tasks in order: RED → GREEN → REFACTOR.
    3. RED task: write the failing test. The task is done when the test runs and
    fails for the expected reason.
    4. GREEN task: write minimal code to make the failing test pass. The task is
    done when the test passes AND all previously-passing tests still pass.
    5. REFACTOR task: clean up the code. The task is done when all tests still
    pass after refactoring.
    6. Never skip ahead to a later slice while a RED task is pending in the
    current slice.

    Mark completed tasks as you go. Pause if you hit blockers or need clarification.
