[project]
name = "microjail"
version = "0.1.0"
description = "Ephemeral, network-sealed environments for running workloads you don't fully trust."
readme = "README.md"
authors = [{ name = "Zachary Raines", email = "zachary.raines@canonical.com" }]
license = "GPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
    "anyio>=4.13.0",
    "msgspec>=0.21.1",
    "rich>=14.2.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.25.0",
]

[project.scripts]
microjail = "microjail.cli:app"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.0.3", "pyupgrade>=3.21.2", "ruff>=0.15.15", "ty>=0.0.40"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "RUF", # Ruff-specific rules
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "TC",  # flake8-type-checking
]

ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.ty.environment]
python-version = "3.14"
extra-paths = [".venv/lib/python3.14/site-packages"]

[tool.pytest.ini_options]
anyio_mode = "auto"
markers = [
    "lxd: requires a running LXD daemon (lxc available and responsive)",
    "workshop: requires the Workshop CLI (workshop binary on PATH)",
    "long_running: slow test (container creation etc.); pass --run-long to include",
]
